[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "discoeb"
version = "0.1.0"
dependencies = [
    # JAX's CUDA 13 build starts after it dropped Python 3.10, so 3.10 takes the
    # CUDA 12 one (jax 0.6.2, the last release for 3.10, which modax supports).
    "jax[cuda13]; python_version >= '3.11'",
    "jax[cuda12]; python_version < '3.11'",
    # The perturbation solve runs on modax's sparse direct linear solver, whose
    # fill-reducing ordering is SuiteSparse's AMD (through cvxopt's wheel since
    # modax-solvers 0.0.3; the `sparse` extra is kept for older checkouts).
    # 0.0.5 for solve(..., sensitivity=) and the packed-diagonal fix.
    "modax-solvers[sparse]>=0.0.5",
    "equinox>=0.13",
    "xprof>=2.21.6",
    "tensorflow>=2.20.0",
    "pytest>=8.4.2",
    "pytest-benchmark>=5.2.3",
    "pytest-regressions>=2.8.3",
    "camb>=1.6.0",
    "pandas>=2.3.3",
    "matplotlib>=3.9.4",
    # 0.3.0 for the O3 prepasses the kernels need and Blackwell support.
    "numba-enzyme-cuda>=0.3.0",
]
authors = [{ name = "Oliver Hahn", email = "oliver.hahn@univie.ac.at" }]

description = "..."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Astronomy",
]

# The GPU stack must match modax's lock: these kernels are compiled by
# numba-cuda-mlir and linked by nvjitlink, and 0.5.2 with CUDA 13.4 emits a
# `.smax` that ptxas rejects when building the 50-variable Enzyme kernel. On
# Python 3.10 modax runs the whole stack on CUDA 12 instead, so the 13.x toolkit
# pin applies only above it. nvJitLink is pinned with it because JAX would
# otherwise pull the newest, and nvJitLink 13.4+ rejects numba-cuda-mlir 0.5.1's
# Blackwell (sm_100+) LTO IR ("Target-incompatible DataLayout"); from the same
# release as libNVVM, it links for Blackwell and for everything older.
[tool.uv]
constraint-dependencies = [
    "numba-cuda-mlir==0.5.1",
    "cuda-toolkit==13.2.1; python_version >= '3.11'",
    "nvidia-nvjitlink==13.2.*; python_version >= '3.11'",
]

# numba-enzyme caps numba below 0.62 and llvmlite below 0.45 for its CPU
# pipeline, which hands llvmlite's IR to its vendored LLVM 15 tools. This
# project only uses its CUDA backend, where numba-cuda-mlir emits the IR, so
# the cap is lifted here rather than letting it drag numba and numpy back to
# the LLVM 15 releases (numba 0.61, numpy 2.2).
override-dependencies = ["numba>=0.61", "llvmlite>=0.44"]

[project.optional-dependencies]
dev = ["pytest", "pytest-benchmark", "pytest-regressions", "camb>=1.6.0", "classy>=3.3.4.0", "ipykernel>=6.31.0", "matplotlib>=3.9.4", "pandas"]
docs = ["sphinx", "nbsphinx"]

[project.urls]
Homepage = "https://github.com/ohahn/DISCO-EB"
Issues = "https://github.com/ohahn/DISCO-EB/issues"
Repository = "https://github.com/ohahn/DISCO-EB.git"
